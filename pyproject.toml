[project]
name = "pac-man"
version = "0.1.0"
description = "A configurable Pac-Man game using the assigned MazeGenerator"
readme = "README.md"
authors = [
    { name = "tlaghzal", email = "laghzaltarik0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mazegenerator",
    "pydantic>=2.14.1",
    "pygame>=2.6.1",
]

[project.scripts]
pac-man = "src.__main__:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pyinstaller>=6.22.3",
]

[tool.uv.build-backend]
module-name = "src"
module-root = ""
